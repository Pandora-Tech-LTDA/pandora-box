name: Publicar skills

# Convenção: cada skill fica em skills/<família>/<skill>/SKILL.md, e cada família
# precisa estar listada em "skills" no skills/.claude-plugin/plugin.json.
#
# Gera o plugin "pandora" (todas as skills num só .zip) e um .zip por skill,
# e publica na release "skills", com links fixos para download:
# https://github.com/Pandora-Tech-LTDA/pandora-box/releases/download/skills/pandora.zip
# https://github.com/Pandora-Tech-LTDA/pandora-box/releases/download/skills/<skill>.zip

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "LICENSE"
      - ".github/workflows/publicar-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-skills
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar o plugin e as skills
        run: |
          mkdir -p dist build/pandora
          # 1. Plugin "pandora": todas as skills num só arquivo (Claude.ai, Cowork e Claude Code)
          cp -r skills/.claude-plugin build/pandora/
          cp skills/README.md skills/icon.png build/pandora/
          cp LICENSE build/pandora/LICENSE
          for f in skills/*/*/SKILL.md; do
            d="$(dirname "$f")"; nome="$(basename "$d")"; fam="$(basename "$(dirname "$d")")"
            [ "$nome" = "_modelo" ] && continue
            mkdir -p "build/pandora/$fam"
            cp -r "$d" "build/pandora/$fam/"
            rm -f "build/pandora/$fam/$nome/README.md"  # a página da skill tem links que só funcionam no repositório
          done
          (cd build && zip -qr "$GITHUB_WORKSPACE/dist/pandora.zip" pandora)
          echo "plugin: pandora.zip"
          # 2. Uma skill por arquivo (para quem prefere instalar só uma, ou outros agentes).
          #    O envio avulso de skills no Claude.ai não aceita a chave disable-model-invocation.
          mkdir -p build/avulsas
          for f in skills/*/*/SKILL.md; do
            d="$(dirname "$f")"; nome="$(basename "$d")"
            [ "$nome" = "_modelo" ] && continue
            cp -r "$d" "build/avulsas/$nome"
            rm -f "build/avulsas/$nome/README.md"
            # remove a chave só no frontmatter (entre as duas primeiras linhas ---)
            awk 'BEGIN{n=0} /^---$/{n++} !(n==1 && /^disable-model-invocation:/)' "build/avulsas/$nome/SKILL.md" > tmp && mv tmp "build/avulsas/$nome/SKILL.md"
            (cd build/avulsas && zip -qr "$GITHUB_WORKSPACE/dist/$nome.zip" "$nome")
            echo "skill: $nome.zip"
          done
          ls -la dist

      - name: Publicar na release "skills"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view skills >/dev/null 2>&1; then
            gh release create skills --target "$GITHUB_SHA" \
              --title "Skills da Pandora Box (versão mais recente)" \
              --notes "pandora.zip é o plugin com todas as skills (instale em Personalizar → Plugins → Adicionar → Enviar plugin). Os demais .zip são as skills avulsas. Tudo é atualizado automaticamente a cada mudança em skills/. Guia: https://github.com/Pandora-Tech-LTDA/pandora-box/blob/main/guias/como-instalar-skills.md"
          fi
          gh release upload skills dist/*.zip --clobber
          # depois de enviar os novos, remove os arquivos de skills que não existem mais (por exemplo, depois de renomear uma skill)
          for antigo in $(gh release view skills --json assets -q '.assets[].name'); do
            [ -f "dist/$antigo" ] || gh release delete-asset skills "$antigo" -y
          done
